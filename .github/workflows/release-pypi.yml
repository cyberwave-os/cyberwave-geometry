name: Release to PyPI

# Runs in the public cyberwave-os/cyberwave-geometry repo, whose root is this
# tree. The monorepo's geometry-core.yml subtree-pushes it on production and
# tags v<version>, which is what triggers this.
#
# Wheels only, no sdist, and never a bare `python -m build`:
# * `python -m build` builds the wheel from an unpacked sdist in a temp dir,
#   and setup.py compiles the core from two levels above bindings/python --
#   which the sdist does not contain -- so it fails before producing a wheel.
# * Even built in place, a wheel from a stock runner is tagged linux_x86_64,
#   and PyPI rejects that tag on upload.
# * An sdist of bindings/python alone cannot be installed for the same reason,
#   so publishing one would turn "no wheel for your platform" into a confusing
#   build error.
# The build jobs below are the same ones geometry-core.yml runs for the
# Buildkite prereleases.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  linux-wheels:
    name: Wheels (manylinux ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - arch: aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' bindings/python/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${VERSION}"
            exit 1
          fi

      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build manylinux wheels
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          docker run --rm \
            --platform "linux/${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}" \
            -v "$PWD":/io:ro \
            -v "$PWD/wheelhouse":/out \
            "${{ matrix.image }}" \
            bash /io/.github/scripts/build_manylinux_wheels.sh

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  native-wheels:
    name: Wheels (${{ matrix.target.name }})
    # cibuildwheel builds in place on macOS and Windows, where the whole tree is
    # already checked out, so setup.py finds the core two levels up. See
    # geometry-core.yml in the monorepo for why each runner builds only its own
    # architecture.
    runs-on: ${{ matrix.target.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: macos-arm64
            runs-on: macos-15
            cibw_archs: arm64
          - name: macos-x86_64
            runs-on: macos-15-intel
            cibw_archs: x86_64
          - name: windows-amd64
            runs-on: windows-latest
            cibw_archs: AMD64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        with:
          package-dir: bindings/python
          output-dir: wheelhouse
        env:
          # The same four interpreters PYTHONS covers in
          # .github/scripts/build_manylinux_wheels.sh.
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-win32 *_i686"
          CIBW_ARCHS: ${{ matrix.target.cibw_archs }}
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_COMMAND: 'python -c "import cyberwave_geometry as g; print(''geometry core'', g.core_version())"'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  pypi-publish:
    name: Upload release to PyPI
    # Both build jobs, so a release never goes out with a partial platform set.
    needs: [linux-wheels, native-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Mandatory for Trusted Publishing
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: List wheels
        run: ls -1 dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # A re-run after a partial upload finishes the job instead of failing
          # on the files that already went up. A forgotten version bump is still
          # caught upstream: the monorepo cannot push the same tag twice.
          skip-existing: true
